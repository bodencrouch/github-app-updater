[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-app-updater"
version = "0.1.0"
description = "Download, verify, and install GitHub release assets with restart strategies"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "bodencrouch" }]
dependencies = [
    "requests",
    "certifi",
    "pycryptodome",
]

[project.urls]
Homepage = "https://github.com/bodencrouch/github-app-updater"
Repository = "https://github.com/bodencrouch/github-app-updater"

[tool.setuptools.packages.find]
where = ["src"]
